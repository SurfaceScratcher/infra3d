name: Release

# Changesets opens a "Version packages" PR from pending changesets.
# Merging that PR publishes the bumped packages to npm through trusted publishing:
# npm accepts this workflow's OIDC identity, so no npm token is stored anywhere.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build -w infra3d -w infra3d-import-compose
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
