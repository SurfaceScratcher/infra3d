name: Release

# Changesets opens a "Version packages" PR from pending changesets.
# Merging that PR publishes the bumped packages to npm through trusted publishing:
# npm accepts this workflow's OIDC identity, so no npm token is stored anywhere.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the parent commit tells whether this push changed the app version
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w infra3d -w infra3d-import-compose
      # Node 24 ships npm 11, which supports trusted publishing
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: npx changeset version
          publish-script: npx changeset publish
          commit-message: 'Version packages'
          pr-title: 'Version packages'
        env:
          NPM_CONFIG_PROVENANCE: true
      # The app image has its own version (apps/app/package.json), which Changesets bumps with the app
      # or its packages. Merging the version PR changes it, and the image job tags :latest and :<version>.
      - id: version
        run: |
          version=$(jq -r .version apps/app/package.json)
          previous=$(git show HEAD^:apps/app/package.json | jq -r .version)
          if [ "$version" != "$previous" ]; then echo "version=$version" >> "$GITHUB_OUTPUT"; fi

  image:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
