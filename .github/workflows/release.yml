name: Release

# Changesets opens a "Version packages" PR from pending changesets.
# Merging that PR publishes the bumped packages to npm.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Skip until the NPM_TOKEN secret is configured
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w infra3d -w infra3d-import-compose
      - uses: changesets/action@v1
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
