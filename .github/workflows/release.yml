name: Release

# Changesets opens a "Version packages" PR from pending changesets.
# Merging that PR publishes the bumped packages to npm through trusted publishing:
# npm accepts this workflow's OIDC identity, so no npm token is stored anywhere.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w infra3d -w infra3d-import-compose
      # Node 24 ships npm 11, which supports trusted publishing
      - uses: changesets/action@v2
        id: changesets
        with:
          version-script: npx changeset version
          publish-script: npx changeset publish
          commit-message: 'Version packages'
          pr-title: 'Version packages'
        env:
          NPM_CONFIG_PROVENANCE: true
      # The app image follows the version of the infra3d package
      - id: version
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: echo "version=$(jq -r '.[] | select(.name == "infra3d") | .version' <<< "$PUBLISHED")" >> "$GITHUB_OUTPUT"

  image:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
