name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # the app server type-checks against the built packages
      - run: npm run build -w infra3d -w infra3d-import-compose
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
