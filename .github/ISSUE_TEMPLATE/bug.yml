name: Bug report
description: Something renders wrong, crashes or gives a wrong analysis
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A minimal topology (JSON) or compose file helps most. Please remove real hostnames and addresses.
      render: json
  - type: textarea
    id: report
    attributes:
      label: Import report
      description: >-
        If the importer misreads your setup: click "import report" at the bottom of the app's sidebar,
        or run `npx infra3d-import-compose <your stacks> -r report.json`. It replaces domains, IPs, host
        names and secrets. Read it, then drag the file here.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: infra3d, react, @react-three/fiber, @react-three/drei, three, browser
