services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11
    ports:
      - "2222:22"
      - "3000"
      - target: 9000
        published: 9000
    networks:
      proxy: {}
    labels:
      - traefik.http.routers.git.rule=Host(`git.example.com`)
networks:
  proxy:
    external: true
    name: proxy
