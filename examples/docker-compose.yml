# stratoscope-infra as a self-hosted app. Put this next to your stacks and run `docker compose up -d`,
# then open http://<host>:8080.
services:
  stratoscope-infra:
    image: ghcr.io/surfacescratcher/stratoscope-infra:latest
    container_name: stratoscope-infra
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Lets the container check ports published on the Docker host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Your stacks, e.g. /opt/stacks (Dockge, Komodo) with one folder per stack. Also works:
      # a single compose.yaml, one folder per host (stacks/<host>/<stack>/compose.yaml)
      # or the root of an Ansible repository with inventory/ and stacks/
      - /opt/stacks:/stacks:ro
      # Optional: config/stratoscope.config.json with hosts, sites, uplinks and special cases
      # (see packages/compose/stratoscope.config.example.json)
      - ./config:/config:ro
    environment:
      # Optional: notifications when endpoints go down or recover
      # NTFY_URL: https://ntfy.sh/my-homelab
      # WEBHOOK_URL: https://example.com/hooks/stratoscope-infra
      # STRATOSCOPE_BASE_URL: https://infra.example.com
      # STRATOSCOPE_HOST: homeserver
      # Basic Auth for the UI, or put it behind your reverse proxy's login
      # STRATOSCOPE_AUTH: admin:change-me
      STRATOSCOPE_INTERVAL: "60"
